server:
  port: 0

spring:
  application:
    name: lucid-ai-routing-service-test
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: test
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# AI Routing Test Configuration
ai:
  routing:
    default-provider: gemini
    task-providers:
      categorize: openai
      summarize: gemini
      enrich_conversation: langchain
      enrich_message: openai
      analyze_participant: gemini
      assess_urgency: openai
      generate_topic: gemini
      extract_entities: langchain
      sentiment_analysis: openai
    
  providers:
    gemini:
      type: gemini
      api-key: test-gemini-key
      endpoint: https://test-gemini-endpoint
      timeout: 5000
      enabled: true
    
    openai:
      type: openai
      api-key: test-openai-key
      endpoint: https://test-openai-endpoint
      timeout: 5000
      enabled: true
    
    langchain:
      type: langchain
      endpoint: http://test-langchain-endpoint
      timeout: 5000
      enabled: true

# Logging Configuration for Tests
logging:
  level:
    com.lucid.automation.airouting: DEBUG
    org.springframework.web: WARN
    AI_AUDIT: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
