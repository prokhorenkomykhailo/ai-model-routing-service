server:
  port: 0

spring:
  application:
    name: lucid-ai-routing-service-test
  profiles:
    active: test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

  cloud:
    discovery:
      enabled: false

# Disable Eureka for tests
eureka:
  client:
    enabled: false

# Test AI configuration
ai:
  routing:
    default-provider: mock
    task-providers:
      categorize: mock
      summarize: mock
      enrich_conversation: mock
      enrich_message: mock
      analyze_participant: mock
      assess_urgency: mock
      generate_topic: mock
      extract_entities: mock
      sentiment_analysis: mock

  providers:
    mock:
      type: mock
      enabled: true
      timeout: 1000

# Minimal logging for tests
logging:
  level:
    com.lucid.automation.airouting: INFO
    org.springframework: WARN
    AI_AUDIT: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"

# Disable management endpoints
management:
  endpoints:
    enabled-by-default: false
