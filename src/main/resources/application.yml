server:
  port: 8083
  servlet:
    context-path: /

spring:
  application:
    name: lucid-ai-routing-service
  
  datasource:
    url: jdbc:h2:mem:aidb
    driver-class-name: org.h2.Driver
    username: sa
    password: ${H2_PASSWORD:secure123}
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
      path: /h2-console

# AI Routing Configuration
ai:
  routing:
    default-provider: gemini
    task-providers:
      categorize: openai
      summarize: gemini
      enrich_conversation: langchain
      enrich_message: openai
      analyze_participant: gemini
      assess_urgency: openai
      generate_topic: gemini
      extract_entities: langchain
      sentiment_analysis: openai
    
  providers:
    gemini:
      type: gemini
      api-key: ${GEMINI_API_KEY:your-gemini-key}
      endpoint: https://generativelanguage.googleapis.com/v1/models
      timeout: 30000
      enabled: true
    
    openai:
      type: openai
      api-key: ${OPENAI_API_KEY:your-openai-key}
      endpoint: https://api.openai.com/v1
      timeout: 30000
      enabled: true
    
    langchain:
      type: langchain
      endpoint: ${LANGCHAIN_SERVICE_URL:http://localhost:8000}
      timeout: 60000
      enabled: true

# Logging Configuration
logging:
  level:
    com.lucid.automation.airouting: DEBUG
    org.springframework.web: INFO
    AI_AUDIT: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ai-routing-service.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Info endpoint
info:
  app:
    name: ${spring.application.name}
    description: AI Model Routing and Orchestration Service
    version: 1.0.0
    encoding: UTF-8
    java:
      version: ${java.version}