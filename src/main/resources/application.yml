server:
  port: 8083
  servlet:
    context-path: /

spring:
  application:
    name: lucid-ai-routing-service
  profiles:
    active: '@activatedProperties@'  # Replace or override this at runtime
  
  # Jackson Configuration for LocalDateTime serialization
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  
  datasource:
    url: jdbc:h2:mem:aidb
    driver-class-name: org.h2.Driver
    username: sa
    password: ${H2_PASSWORD:secure123}
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
      path: /h2-console

  cloud:
    discovery:
      enabled: true

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 30000
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 3
        max-concurrency: 10
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

# Service Discovery Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Security Configuration
security:
  jwt:
    secret-key: M2NmYTc2ZWYxNDkzN2MxYzBlYTUxOWY4ZmMwNTdhODBmY2QwNGE3NDIwZjhlOGJjZDBhNzU2N2MyNzJlMDA3Yg==
    expiration-time: 28800000  # 8 hours in milliseconds

# AI Routing Configuration
ai:
  routing:
    default-provider: gemini
    task-providers:
      categorize: openai
      summarize: gemini
      enrich_conversation: langchain
      enrich_message: openai
      analyze_participant: gemini
      assess_urgency: openai
      generate_topic: gemini
      extract_entities: langchain
      sentiment_analysis: openai
    

# Logging Configuration
logging:
  level:
    com.lucid.automation.airouting: DEBUG
    org.springframework.web: INFO
    AI_AUDIT: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ai-routing-service.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Info endpoint
info:
  app:
    name: ${spring.application.name}
    description: AI Model Routing and Orchestration Service
    version: 1.0.0
    encoding: UTF-8
    java:
      version: ${java.version}

# RabbitMQ Queue Configuration
rabbitmq:
  exchange:
    ai-requests: ai.requests
    ai-responses: ai.responses
  queue:
    ai-requests: ai.requests.queue
    ai-categorize: ai.categorize.queue
    ai-summarize: ai.summarize.queue
    ai-enrich: ai.enrich.queue
    ai-responses: ai.responses.queue
  routing:
    categorize: ai.categorize
    summarize: ai.summarize
    enrich: ai.enrich
    responses: ai.responses