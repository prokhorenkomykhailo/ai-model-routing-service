server:
  port: 8083
  servlet:
    context-path: /

spring:
  application:
    name: lucid-ai-routing-service
  profiles:
    active: '@activatedProperties@'  # Replace or override this at runtime

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      database: 0
    
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  cloud:
    discovery:
      enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 30000
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

# OpenTelemetry Configuration
opentelemetry:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  sampler:
    probability: 1.0
  resource:
    attributes:
      service.name: ${OTEL_SERVICE_NAME:gateway-service}
      service.version: ${OTEL_SERVICE_VERSION:1.0.0}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

security:
  jwt:
    secret-key: M2NmYTc2ZWYxNDkzN2MxYzBlYTUxOWY4ZmMwNTdhODBmY2QwNGE3NDIwZjhlOGJjZDBhNzU2N2MyNzJlMDA3Yg==
    expiration-time: 28800000  # 8 hours in milliseconds

ai:
  routing:
    default-provider: geminiProvider
    task-providers:
      categorize: geminiProvider
      summarize: geminiProvider
      enrich_conversation: geminiProvider
      enrich_message: geminiProvider
      analyze_participant: geminiProvider
      assess_urgency: geminiProvider
      generate_topic: geminiProvider
      extract_entities: geminiProvider
      sentiment_analysis: geminiProvider
  enrichment:
    scheduler:
      cron: "${AI_ENRICHMENT_CRON:0 */5 * * * ?}"  # Every 5 minutes by default
      enabled: "${AI_ENRICHMENT_ENABLED:true}"
      batch-size: "${AI_ENRICHMENT_BATCH_SIZE:50}"
      max-retries: "${AI_ENRICHMENT_MAX_RETRIES:3}"
      default-tenant-id: "${DEFAULT_TENANT_ID:default-tenant}"
      default-tenant-schema: "${DEFAULT_TENANT_SCHEMA:public}"


# Logging Configuration
logging:
  level:
    com.lucid.automation.airouting: DEBUG
    org.springframework.web: INFO
    AI_AUDIT: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ai-routing-service.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Info endpoint
info:
  app:
    name: ${spring.application.name}
    description: AI Model Routing and Orchestration Service
    version: 1.0.0
    encoding: UTF-8
    java:
      version: ${java.version}

# RabbitMQ Queue Configuration
rabbitmq:
  exchange:
    ai-requests: ai.requests
    ai-responses: ai.responses
    ingestion-messages: ${RABBITMQ_EXCHANGE_INGESTION_MESSAGES:ingestion.messages}
  queue:
    ai-requests: ai.requests.queue
    ai-categorize: ai.categorize.queue
    ai-summarize: ai.summarize.queue
    ai-enrich: ai.enrich.queue
    ai-responses: ai.responses.queue
    ai-enrich-conversation-response: ai.enrich.conversation.response.queue
    ingestion-messages: ${RABBITMQ_QUEUE_INGESTION_MESSAGES:ingestion.messages.queue}
  routing:
    categorize: ai.categorize
    summarize: ai.summarize
    enrich: ai.enrich
    responses: ai.responses
    enrich-conversation-response: ai.enrich.conversation.response
    ingestion-messages: ${RABBITMQ_ROUTING_INGESTION_MESSAGES:ingestion.messages}

# Redis Conversation Configuration
redis:
  conversation:
    max-messages: ${REDIS_MAX_MESSAGES:100}
    ttl-seconds: ${REDIS_TTL_SECONDS:604800} # 7 days (604800 seconds)

