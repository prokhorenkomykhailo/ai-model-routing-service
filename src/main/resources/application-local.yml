spring:
  application:
    name: ai-routing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:database-1.co5mcmkmyz7i.us-east-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:ai_routing_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:1234566}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Local AI provider configurations with mock/test keys
ai:
  providers:
    gemini:
      type: gemini
      api-key: ${GEMINI_API_KEY:}
      endpoint: https://generativelanguage.googleapis.com/v1/models
      timeout: 30000
      enabled: true
    
    openai:
      type: openai
      api-key: ${OPENAI_API_KEY:test-openai-key}
      endpoint: https://api.openai.com/v1
      timeout: 30000
      enabled: true

# Swagger/OpenAPI Configuration for local development
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    gateway-uri: /
  show-actuator: true
  use-management-port: false
  default-produces-media-type: application/json
  packages-to-scan: com.lucid.automation.airouting.controller

# Enhanced logging for local development
logging:
  level:
    com.lucid.automation.airouting: DEBUG
    org.springframework.web: DEBUG
    AI_AUDIT: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Data storage service configuration
data-storage-service:
  url: ${DATA_STORAGE_SERVICE_URL:http://localhost:8082}

# auth service configuration
auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8088}
