# Local development profile
spring:
  datasource:
    url: jdbc:h2:file:./data/aidb-local
    driver-class-name: org.h2.Driver
    username: sa
    password: local123

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# Local AI provider configurations with mock/test keys
ai:
  providers:
    gemini:
      type: gemini
      api-key: ${GEMINI_API_KEY:test-gemini-key}
      endpoint: https://generativelanguage.googleapis.com/v1/models
      timeout: 30000
      enabled: true
    
    openai:
      type: openai
      api-key: ${OPENAI_API_KEY:test-openai-key}
      endpoint: https://api.openai.com/v1
      timeout: 30000
      enabled: true

# Swagger/OpenAPI Configuration for local development
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    gateway-uri: /
  show-actuator: true
  use-management-port: false
  default-produces-media-type: application/json
  packages-to-scan: com.lucid.automation.airouting.controller

# Enhanced logging for local development
logging:
  level:
    com.lucid.automation.airouting: DEBUG
    org.springframework.web: DEBUG
    AI_AUDIT: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
