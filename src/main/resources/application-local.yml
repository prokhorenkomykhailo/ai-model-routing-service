# Disable Eureka client for local profile
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ''
spring:
  cloud:
    discovery:
      enabled: false
  application:
    name: ai-routing-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${SPRING_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      "[sasl.mechanism]": ${SPRING_KAFKA_SASL_MECHANISM:}
      "[sasl.jaas.config]": ${SPRING_KAFKA_SASL_JAAS_CONFIG:}

  # Redis Configuration for local development
  data:
    redis:
      host: ${REDIS_HOST:10.113.213.30}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      database: 0

# Local AI provider configurations with mock/test keys
ai:
  providers:
    gemini:
      type: gemini
      api-key: ${GEMINI_API_KEY:}
      endpoint: https://generativelanguage.googleapis.com/v1/models
      timeout: 30000
      enabled: true

    openai:
      type: openai
      api-key: ${OPENAI_API_KEY:test-openai-key}
      endpoint: https://api.openai.com/v1
      timeout: 30000
      enabled: true

# Swagger/OpenAPI Configuration for local development
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    gateway-uri: /
  show-actuator: true
  use-management-port: false
  default-produces-media-type: application/json
  packages-to-scan: com.lucid.automation.airouting.controller

# Enhanced logging for local development
logging:
  level:
    com.lucid.automation.airouting: DEBUG
    org.springframework.web: DEBUG
    AI_AUDIT: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Data storage service configuration
data-storage-service:
  url: ${DATA_STORAGE_SERVICE_URL:http://localhost:8082}

# auth service configuration
auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8088}

# Sliding window configuration for token-based batch sizing
sliding:
  window:
    default:
      batch:
        size: 50
      overlap:
        percentage: 20
    max:
      tokens: 10000  # Reduced from 15000 to avoid Kafka RecordTooLargeException
    avg:
      tokens:
        per:
          message: 50

# Disable anonymization service locally (no 8089 dependency for prompt runs)
anonymization:
  service:
    enabled: ${ANONYMIZATION_SERVICE_ENABLED:false}

# Optional CSV runner for Step 1 testing (disabled by default; set enabled=true to run once on startup)
topic:
  clustering:
    runner:
      enabled: ${TOPIC_CLUSTERING_RUNNER_ENABLED:false}
      csv-path: ${TOPIC_CLUSTERING_RUNNER_CSV_PATH:}
      tenant-id: ${TOPIC_CLUSTERING_RUNNER_TENANT_ID:}
      workspace-id: ${TOPIC_CLUSTERING_RUNNER_WORKSPACE_ID:}
      workspace-name: ${TOPIC_CLUSTERING_RUNNER_WORKSPACE_NAME:}
      batch-number: ${TOPIC_CLUSTERING_RUNNER_BATCH_NUMBER:1}
  merge-split:
    draft-topic: ${TOPIC_MERGE_SPLIT_DRAFT_TOPIC:ai-topic-drafts}
    refined-topic: ${TOPIC_MERGE_SPLIT_REFINED_TOPIC:ai-topic-refined}
    dlq-topic: ${TOPIC_MERGE_SPLIT_DLQ_TOPIC:ai-topic-drafts-dlq}
    similarity-threshold: ${TOPIC_MERGE_SPLIT_SIMILARITY_THRESHOLD:0.85}
    split-enabled: ${TOPIC_MERGE_SPLIT_SPLIT_ENABLED:true}
    max-messages-per-cluster: ${TOPIC_MERGE_SPLIT_MAX_MESSAGES_PER_CLUSTER:40}
    split-chunk-size: ${TOPIC_MERGE_SPLIT_SPLIT_CHUNK_SIZE:25}
  metadata:
    refined-topic: ${TOPIC_METADATA_REFINED_TOPIC:ai-topic-refined}
    metadata-topic: ${TOPIC_METADATA_METADATA_TOPIC:ai-topic-metadata}
    dlq-topic: ${TOPIC_METADATA_DLQ_TOPIC:ai-topic-metadata-dlq}
    tenant-id: ${TOPIC_METADATA_TENANT_ID:}
    prompt-name: ${TOPIC_METADATA_PROMPT_NAME:topic_metadata/v2/topic_metadata}
    prompt-version: ${TOPIC_METADATA_PROMPT_VERSION:v2}
    max-messages: ${TOPIC_METADATA_MAX_MESSAGES:60}
    max-message-characters: ${TOPIC_METADATA_MAX_MESSAGE_CHARACTERS:600}
    max-prompt-characters: ${TOPIC_METADATA_MAX_PROMPT_CHARACTERS:180000}
    csv-fallback-enabled: ${TOPIC_METADATA_CSV_FALLBACK_ENABLED:false}
    csv-path: ${TOPIC_METADATA_CSV_PATH:}
    repair-empty-action-items-enabled: ${TOPIC_METADATA_REPAIR_EMPTY_ACTION_ITEMS_ENABLED:true}
    repair-empty-action-items-max-attempts: ${TOPIC_METADATA_REPAIR_EMPTY_ACTION_ITEMS_MAX_ATTEMPTS:1}
  embedding:
    metadata-topic: ${TOPIC_EMBEDDING_METADATA_TOPIC:ai-topic-metadata}
    dlq-topic: ${TOPIC_EMBEDDING_DLQ_TOPIC:ai-topic-embeddings-dlq}
    provider: ${TOPIC_EMBEDDING_PROVIDER:gemini}
    gemini-model: ${TOPIC_EMBEDDING_GEMINI_MODEL:text-embedding-004}
    dimension: ${TOPIC_EMBEDDING_DIMENSION:768}
    pgvector:
      jdbc-url: ${TOPIC_EMBEDDING_PGVECTOR_JDBC_URL:}
      username: ${TOPIC_EMBEDDING_PGVECTOR_USERNAME:}
      password: ${TOPIC_EMBEDDING_PGVECTOR_PASSWORD:}
      schema: ${TOPIC_EMBEDDING_PGVECTOR_SCHEMA:public}
      table: ${TOPIC_EMBEDDING_PGVECTOR_TABLE:topics_embeddings}
      auto-ddl: ${TOPIC_EMBEDDING_PGVECTOR_AUTO_DDL:true}
      search-top-k-default: ${TOPIC_EMBEDDING_PGVECTOR_SEARCH_TOP_K_DEFAULT:10}
  visibility:
    metadata-topic: ${TOPIC_VISIBILITY_METADATA_TOPIC:ai-topic-metadata}
    visibility-topic: ${TOPIC_VISIBILITY_VISIBILITY_TOPIC:topic-visibility}
    dlq-topic: ${TOPIC_VISIBILITY_DLQ_TOPIC:topic-visibility-dlq}
    consumer-group: ${TOPIC_VISIBILITY_CONSUMER_GROUP:ai-service-group-topic-visibility}
    strict-channel-membership: ${TOPIC_VISIBILITY_STRICT_CHANNEL_MEMBERSHIP:false}
    user-channels-json: ${TOPIC_VISIBILITY_USER_CHANNELS_JSON:}
    ttl-seconds: ${TOPIC_VISIBILITY_TTL_SECONDS:3600}
    max-topics-per-user: ${TOPIC_VISIBILITY_MAX_TOPICS_PER_USER:5000}
  update:
    enabled: ${TOPIC_UPDATE_ENABLED:false}
    search-top-k: ${TOPIC_UPDATE_SEARCH_TOP_K:5}
    similarity-threshold: ${TOPIC_UPDATE_SIMILARITY_THRESHOLD:0.85}
    require-same-channel: ${TOPIC_UPDATE_REQUIRE_SAME_CHANNEL:true}
    belongs-check-enabled: ${TOPIC_UPDATE_BELONGS_CHECK_ENABLED:true}
    belongs-check-model-hint: ${TOPIC_UPDATE_BELONGS_CHECK_MODEL_HINT:}
    update-prompt-name: ${TOPIC_UPDATE_PROMPT_NAME:topic_update/v1/topic_update}
    prompt-version: ${TOPIC_UPDATE_PROMPT_VERSION:v1}
