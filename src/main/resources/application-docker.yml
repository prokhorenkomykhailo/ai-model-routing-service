# Docker profile for containerized deployment
server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ai-routing-service
  config:
    import:
      - classpath:pipeline-config-docker.yml
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      database: 0
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: ${REDIS_POOL_MAX_WAIT:2000ms}
          time-between-eviction-runs: ${REDIS_POOL_TIME_BETWEEN_EVICTION_RUNS:30s}
        shutdown-timeout: 100ms

# Service discovery configuration for Docker
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD:changeme}@discovery-service:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: ai-routing-service

# AI provider configurations for Docker environment
ai:
  providers:
    gemini:
      type: gemini
      api-key: ${GEMINI_API_KEY:}
      endpoint: https://generativelanguage.googleapis.com/v1/models
      timeout: 45000
      enabled: ${GEMINI_ENABLED:true}

    openai:
      type: openai
      api-key: ${OPENAI_API_KEY:}
      endpoint: http://10.113.213.9:5003/v1/completions
      timeout: 45000
      enabled: ${OPENAI_ENABLED:true}

# Swagger configuration for Docker
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    disable-swagger-default-url: true
    gateway-uri: /api/ai
  show-actuator: false
  default-produces-media-type: application/json
  packages-to-scan: com.lucid.automation.airouting.controller

# Docker logging configuration
logging:
  level:
    com.lucid.automation.airouting: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    AI_AUDIT: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [${spring.application.name}] %logger{36} - %msg%n"

# OpenTelemetry auto-instrumentation settings for Docker
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      protocol: grpc
  resource:
    attributes:
      '[service.name]': ${OTEL_SERVICE_NAME:ai-routing-service}
      '[service.version]': ${OTEL_SERVICE_VERSION:1.0.0}
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  logs:
    exporter: otlp
  instrumentation:
    spring-webmvc:
      enabled: true
    jdbc:
      enabled: false

# Lucid Configuration - Enable audit logging in docker profile
lucid:
  audit:
    enabled: true

# Anonymization Service Configuration for Docker
anonymization:
  service:
    url: ${ANONYMIZATION_SERVICE_URL:http://anonymization-service:8089}
    enabled: ${ANONYMIZATION_ENABLED:false}
    timeout: ${ANONYMIZATION_TIMEOUT:5000}
    retry:
      max-attempts: ${ANONYMIZATION_RETRY_MAX_ATTEMPTS:3}
      backoff: ${ANONYMIZATION_RETRY_BACKOFF:2000}

# Data storage service configuration
data-storage-service:
  url: ${DATA_STORAGE_SERVICE_URL:http://localhost:8082}

# auth service configuration
auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8088}

# Message retention cleanup configuration
message:
  retention:
    cleanup:
      enabled: ${MESSAGE_RETENTION_CLEANUP_ENABLED:true}  # Enable automatic cleanup of expired messages
      cron: ${MESSAGE_RETENTION_CLEANUP_CRON:0 0 3 * * ?}  # Daily at 3 AM
      batch-size: ${MESSAGE_RETENTION_CLEANUP_BATCH_SIZE:100}  # Process 100 messages per batch
      job-name: message-retention-cleanup
