# Docker profile for containerized deployment
server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ai-routing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:database-1.co5mcmkmyz7i.us-east-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:ai_routing_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:1234566}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Service discovery configuration for Docker
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-service:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: ai-routing-service

# AI provider configurations for Docker environment
ai:
  providers:
    gemini:
      type: gemini
      api-key: ${GEMINI_API_KEY:}
      endpoint: https://generativelanguage.googleapis.com/v1/models
      timeout: 45000
      enabled: ${GEMINI_ENABLED:true}
    
    openai:
      type: openai
      api-key: ${OPENAI_API_KEY:}
      endpoint: http://10.113.213.9:5003/v1/completions
      timeout: 45000
      enabled: ${OPENAI_ENABLED:true}

# Swagger configuration for Docker
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    disable-swagger-default-url: true
    gateway-uri: /api/ai
  show-actuator: false
  default-produces-media-type: application/json
  packages-to-scan: com.lucid.automation.airouting.controller

# Docker logging configuration
logging:
  level:
    com.lucid.automation.airouting: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    AI_AUDIT: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [${spring.application.name}] %logger{36} - %msg%n"

