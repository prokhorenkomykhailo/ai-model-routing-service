# Development profile with persistent database
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_routing_dev
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

# AI provider configurations for development
ai:
  providers:
    gemini:
      type: gemini
      api-key: ${GEMINI_API_KEY:dev-gemini-key}
      endpoint: https://generativelanguage.googleapis.com/v1/models
      timeout: 30000
      enabled: true
    
    openai:
      type: openai
      api-key: ${OPENAI_API_KEY:dev-openai-key}
      endpoint: https://api.openai.com/v1
      timeout: 30000
      enabled: true

# Swagger enabled for dev
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true

# Development logging
logging:
  level:
    com.lucid.automation.airouting: DEBUG
    org.springframework.web: INFO
    AI_AUDIT: DEBUG
    org.hibernate.SQL: DEBUG
