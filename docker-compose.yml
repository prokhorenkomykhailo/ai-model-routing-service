version: '3.8'

services:
  ai-routing-service:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    image: docker.x51.vn/lucy/lucid-ai-routing-service:1.1.2
    container_name: ai-routing-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8083
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Kafka configuration (Local development)
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - SPRING_KAFKA_CONSUMER_GROUP_ID=ai-routing-service-group
      - KAFKA_TOPIC_INGESTION_MESSAGES=lucid-ingestion-messages
      - KAFKA_TOPIC_AI_TASKS=lucid-ai-tasks
      - KAFKA_TOPIC_AI_RESPONSES=ai-responses
      - KAFKA_TOPIC_INGESTION_PROGRESS=ingestion-progress
      # AI Provider configuration
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your-api-key-here}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-your-api-key-here}
      # Swagger/OpenAPI
      - SWAGGER_ENABLED=true
      # OpenTelemetry configuration
      - OTEL_SERVICE_NAME=ai-routing-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
    depends_on:
      - redis
      - kafka
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - lucid-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - lucid-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: "lucid-ingestion-messages:1:1"
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - lucid-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - lucid-network

networks:
  lucid-network:
    driver: bridge

volumes:
  redis-data:
  kafka-data:
  zookeeper-data:
