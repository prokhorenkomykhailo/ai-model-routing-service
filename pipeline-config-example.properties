# Post-Processing Pipeline Configuration Example
# Add these properties to your application.yml or application.properties

# Enable/disable the pipeline architecture
lucid.post-processing.pipeline.enabled=true

# Pipeline type: STANDARD, COMPREHENSIVE, MINIMAL, CUSTOM
lucid.post-processing.pipeline.type=STANDARD

# Whether to continue processing if a step fails
lucid.post-processing.pipeline.continueOnFailure=false

# Maximum execution time for the entire pipeline in milliseconds
lucid.post-processing.pipeline.maxExecutionTimeMs=30000

# Enable detailed logging for debugging
lucid.post-processing.pipeline.detailedLogging=false

# Enable metrics collection
lucid.post-processing.pipeline.metricsEnabled=true

# Custom steps (only used when type is CUSTOM)
# Uncomment and modify as needed:
# lucid.post-processing.pipeline.customSteps[0]=INPUT_VALIDATION
# lucid.post-processing.pipeline.customSteps[1]=MESSAGE_CONVERSION
# lucid.post-processing.pipeline.customSteps[2]=RESPONSE_BUILDING

# YAML format alternative:
# lucid:
#   post-processing:
#     pipeline:
#       enabled: true
#       type: STANDARD
#       continueOnFailure: false
#       maxExecutionTimeMs: 30000
#       detailedLogging: false
#       metricsEnabled: true
#       customSteps:
#         - INPUT_VALIDATION
#         - MESSAGE_CONVERSION
#         - TIMESTAMP_PROCESSING
#         - CONVERSATION_ENRICHMENT
#         - TOPIC_ENRICHMENT
#         - RESPONSE_BUILDING
